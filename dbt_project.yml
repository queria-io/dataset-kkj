name: "kkj"
version: "1.0.0"

profile: "kkj"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "shared/macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  kkj:
    +database: kkj
    +materialized: table
    # raw は取得したまま、stg は型付けと列名の付け替え。どちらも mart の SQL に展開し、テーブルは作らない
    tender:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
