name: kkj
title: 官公需情報ポータルサイト 入札公告
description: |-
  国の機関・独立行政法人・地方公共団体が出した入札公告です。官公需情報ポータルサイト（中小企業庁）が各機関のサイトから集めた公告を、件名・発注機関・都道府県と市区町村・カテゴリー・入札日・開札日・公告文で検索できる形にしています。2021 年 4 月以降の公告を収録し、毎日更新します。

  落札者と落札金額は含みません。

  出典：官公需情報ポータルサイト（https://www.kkj.go.jp/s/）の検索 API を利用して Queria が取得・加工したものです。公告の権利は各発注機関にあります。
keywords:
