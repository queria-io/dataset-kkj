name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@8572caf169e07ce5a0c6e9e88c68c45d1dccf1a2
    with:
      dataset_name: kkj
      # 過去分は 1 回に 180 日分（2 秒おきに 200 回ほど）を取る
      timeout_minutes: 120
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
