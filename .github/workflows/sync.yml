name: Apply

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@3152e2a8a30c350f15e5ab15d7a55847fdf0679c
    with:
      dataset_name: kkj
      # 過去分は 1 回に 180 日分（2 秒おきに 200 回ほど）を取る
      timeout_minutes: 120
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
